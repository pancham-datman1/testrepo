Transform: AWS::Serverless-2016-10-31
Description: Trigger Node.js Lambda function from API

Resources:
  MyNodeLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs18.x
      CodeUri: ./
      MemorySize: 128
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /test
            Method: get
