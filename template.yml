Transform: AWS::Serverless-2016-10-31
Description: Trigger Node.js Lambda function from API

Parameters:
  Alias:
    Type: String
    Default: d
    Description: Environment alias (e.g. d, e). Resources are suffixed with this so each alias can be deployed as its own independent stack.

Resources:
# api gateway
  MyApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub dm-pa-apigateway-${Alias}
      StageName: Prod


  LambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub dm-pa-lambda-layer-${Alias}
      ContentUri: package-layer/
      CompatibleRuntimes:
        - nodejs20.x

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub dm-pa-hello-${Alias}
      Runtime: nodejs20.x
      Handler: hello.handler
      CodeUri: .
      Environment:
        Variables:
          MY_SECRET: '{{resolve:ssm:mySecret1}}'
      Events:
        HelloAPI:
          Type: Api
          Properties:
            RestApiId: !Ref MyApiGateway
            Path: /hello
            Method: GET
  RandomFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub dm-pa-random-${Alias}
      Runtime: nodejs20.x
      Handler: random.handler
      CodeUri: .
      Layers:
        - !Ref LambdaLayer
      Events:
        RandomAPI:
          Type: Api
          Properties:
            RestApiId: !Ref MyApiGateway
            Path: /random
            Method: GET
